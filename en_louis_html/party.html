<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Vocabulaire - Texte à trous + Audio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .instructions {
            background-color: #e8f6f3;
            border-left: 5px solid #1abc9c;
            padding: 15px;
            margin-bottom: 25px;
            color: #16a085;
        }

        .question-row {
            margin-bottom: 15px;
            padding: 15px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .question-row:hover {
            background-color: #fcfcfc;
        }

        .french-term {
            font-weight: bold;
            color: #7f8c8d;
            font-size: 0.95em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .english-sentence {
            font-size: 1.2em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Style spécifique pour le champ à trou */
        input[type="text"] {
            padding: 5px 10px;
            border: 0;
            border-bottom: 2px solid #bdc3c7;
            background-color: #f4f6f7;
            color: #2c3e50;
            font-size: 1em;
            font-weight: bold;
            width: 140px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-bottom-color: #3498db;
            background-color: #ecf0f1;
        }

        input[type="text"].correct {
            border-bottom-color: #2ecc71;
            background-color: #eafaf1;
            color: #27ae60;
        }

        input[type="text"].incorrect {
            border-bottom-color: #e74c3c;
            background-color: #fadbd8;
            color: #c0392b;
        }

        /* Boutons indices */
        .hint-btn-group {
            display: inline-flex;
            gap: 5px;
            margin-left: 10px;
        }

        .btn-mini {
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .btn-mini:active { transform: scale(0.9); }

        .btn-scramble {
            background-color: #f1c40f;
            color: #fff;
        }
        .btn-scramble:hover { background-color: #f39c12; }

        .btn-audio {
            background-color: #3498db;
            color: #fff;
        }
        .btn-audio:hover { background-color: #2980b9; }

        .hint-text {
            font-size: 0.8em;
            color: #95a5a6;
            margin-left: 5px;
            font-style: italic;
        }

        .feedback-msg {
            display: block;
            width: 100%;
            font-size: 0.9em;
            margin-top: 5px;
            color: #e74c3c;
            font-weight: bold;
        }

        .btn-container {
            margin-top: 30px;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        
        .btn-check { background-color: #2ecc71; color: white; }
        .btn-check:hover { background-color: #27ae60; }
        
        .btn-reset { background-color: #3498db; color: white; display: none; }
        .btn-reset:hover { background-color: #2980b9; }

    </style>
</head>
<body>

    <h1>🇬🇧 English Gap Fill Quiz</h1>

    <div class="card">
        <div class="instructions">
            <strong>Consigne :</strong> Complétez la phrase. Utilisez 🔊 pour écouter le mot manquant ou ❓ pour mélanger les lettres.
        </div>

        <div id="quiz-container">
            </div>

        <div class="btn-container">
            <button id="btn-action" class="btn-main btn-check" onclick="checkAnswers()">Corriger</button>
            <button id="btn-restart" class="btn-main btn-reset" onclick="initQuiz()">Nouveau Quiz</button>
        </div>
    </div>

<script>
    const vocabulary = [
        { fr: "temps de midi", pre: "", post: "", ans: "lunchtime" },
        { fr: "à la cantine", pre: "in the", post: "", ans: "canteen" },
        { fr: "un anniversaire", pre: "a", post: "", ans: "birthday" },
        { fr: "quand est ton anniversaire?", pre: "When is your", post: "?", ans: "birthday" },
        { fr: "mon anniversaire est le...", pre: "My", post: "is on...", ans: "birthday" },
        { fr: "l'anniversaire de Kelly", pre: "Kelly's", post: "", ans: "birthday" },
        { fr: "une fête", pre: "a", post: "", ans: "party" },
        { fr: "mars", pre: "", post: "", ans: "March" },
        { fr: "août", pre: "", post: "", ans: "August" },
        { fr: "aujourd'hui", pre: "", post: "", ans: "today" },
        { fr: "ce soir", pre: "", post: "", ans: "tonight" },
        { fr: "de toute manière", pre: "", post: "", ans: "anyway" },
        { fr: "quand", pre: "", post: "", ans: "when" },
        { fr: "souviens-toi!", pre: "", post: "!", ans: "remember" },
        { fr: "quel âge as-tu ?", pre: "how", post: "are you?", ans: "old" },
        { fr: "j'ai... ans", pre: "I'm... years", post: "", ans: "old" },
        { fr: "c'est bon à savoir", pre: "that's good to", post: "", ans: "know" },
        { fr: "et toi? et vous?", pre: "what", post: "you?", ans: "about" }, 
        { fr: "pas de chance !", pre: "hard", post: "!", ans: "luck" },
        { fr: "c'est génial !", pre: "it", post: "!", ans: "rocks" },
        { fr: "chez moi", pre: "at my", post: "", ans: "place" },
        { fr: "pendant les vacances", pre: "during the", post: "", ans: "holiday" },
        { fr: "le jour de la Saint Patrick", pre: "on St Patrick's", post: "", ans: "day" },
        { fr: "le 17 mars", pre: "on 17th", post: "", ans: "March" },
        { fr: "en mars", pre: "in", post: "", ans: "March" }
    ];

    let currentQuestions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function scrambleWord(word) {
        const arr = word.split('');
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.join(' ');
    }

    // Fonction de synthèse vocale
    function pronounceWord(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB'; // Force l'anglais (GB ou US selon dispo)
            utterance.rate = 0.9; // Légèrement plus lent pour bien entendre
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Votre navigateur ne supporte pas l'audio.");
        }
    }

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        
        document.getElementById('btn-action').style.display = 'block';
        document.getElementById('btn-restart').style.display = 'none';

        const shuffled = shuffleArray([...vocabulary]);
        currentQuestions = shuffled.slice(0, 10);

        currentQuestions.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'question-row';

            const frLabel = document.createElement('div');
            frLabel.className = 'french-term';
            frLabel.textContent = item.fr;

            const enSentence = document.createElement('div');
            enSentence.className = 'english-sentence';

            if (item.pre) {
                const preSpan = document.createElement('span');
                preSpan.textContent = item.pre;
                enSentence.appendChild(preSpan);
            }

            const input = document.createElement('input');
            input.type = 'text';
            input.id = `q-${index}`;
            input.autocomplete = 'off';
            input.dataset.answer = item.ans;
            enSentence.appendChild(input);

            if (item.post) {
                const postSpan = document.createElement('span');
                postSpan.textContent = item.post;
                enSentence.appendChild(postSpan);
            }

            // Groupe de boutons d'indices
            const btnGroup = document.createElement('div');
            btnGroup.className = 'hint-btn-group';

            // Bouton Audio
            const audioBtn = document.createElement('button');
            audioBtn.className = 'btn-mini btn-audio';
            audioBtn.innerHTML = '🔊'; // Emoji speaker
            audioBtn.title = "Écouter le mot";
            audioBtn.onclick = function() {
                pronounceWord(item.ans);
            };

            // Bouton Scramble
            const scrambleBtn = document.createElement('button');
            scrambleBtn.className = 'btn-mini btn-scramble';
            scrambleBtn.innerHTML = '❓';
            scrambleBtn.title = "Mélanger les lettres";
            scrambleBtn.onclick = function() {
                const hintTarget = document.getElementById(`hint-txt-${index}`);
                if(hintTarget.innerText === "") {
                    hintTarget.innerText = `(${scrambleWord(item.ans)})`;
                }
            };

            btnGroup.appendChild(audioBtn);
            btnGroup.appendChild(scrambleBtn);
            enSentence.appendChild(btnGroup);

            const hintTxt = document.createElement('span');
            hintTxt.id = `hint-txt-${index}`;
            hintTxt.className = 'hint-text';
            enSentence.appendChild(hintTxt);

            const feedback = document.createElement('div');
            feedback.id = `fb-${index}`;
            feedback.className = 'feedback-msg';
            feedback.style.display = 'none';

            row.appendChild(frLabel);
            row.appendChild(enSentence);
            row.appendChild(feedback);
            container.appendChild(row);
        });
    }

    function checkAnswers() {
        let score = 0;

        currentQuestions.forEach((item, index) => {
            const input = document.getElementById(`q-${index}`);
            const feedback = document.getElementById(`fb-${index}`);
            const userVal = input.value.trim().toLowerCase();
            const correctVal = item.ans.toLowerCase();

            if (userVal === correctVal) {
                input.className = 'correct';
                score++;
                feedback.style.display = 'none';
            } else {
                input.className = 'incorrect';
                feedback.innerHTML = `Réponse : <strong>${item.ans}</strong>`;
                feedback.style.display = 'block';
            }
        });

        const btnAction = document.getElementById('btn-action');
        const btnRestart = document.getElementById('btn-restart');

        btnAction.style.display = 'none';
        btnRestart.style.display = 'block';
        btnRestart.textContent = `Score : ${score}/10 - Recommencer`;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();

</script>

</body>
</html>
