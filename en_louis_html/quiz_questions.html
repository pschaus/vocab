<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Forme interrogative — Test</title>
<style>
  :root { --bg:#f6f8fb; --card:#fff; --accent:#2b8a3e; --muted:#666; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; background:var(--bg); color:#222; padding:1rem; }
  header { text-align:center; margin-bottom:0.6rem; }
  h1 { font-size:1.2rem; margin:0; }
  p.lead { margin:0.4rem 0 1rem 0; color:var(--muted); font-size:0.95rem; }
  .quiz { display:flex; flex-direction:column; gap:0.7rem; }
  .card { background:var(--card); border-radius:12px; padding:0.9rem; box-shadow:0 6px 18px rgba(20,30,50,0.06); transition:all 0.4s ease; }
  .clue { font-size:0.95rem; color:var(--muted); margin-bottom:0.5rem; }
  .question-row { display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center; }
  input[type="text"] { flex:0 0 38%; min-width:100px; padding:0.45rem 0.5rem; border-radius:8px; border:1px solid #d0d6dc; font-size:1rem; }
  .rest { font-size:1rem; color:#111; margin-left:0.2rem; }
  button { width:100%; padding:0.9rem; font-size:1.05rem; border:0; background:var(--accent); color:#fff; border-radius:12px; margin-top:0.8rem; cursor:pointer; transition:background 0.3s ease; }
  button:hover { background:#237032; }
  #result { margin-top:0.8rem; display:none; }
  .result-card { background:#fff; padding:0.8rem; border-radius:10px; box-shadow:0 4px 12px rgba(20,30,50,0.05); margin-top:0.7rem; }
  .ok { color:green; font-weight:600; }
  .bad { color:#c33; font-weight:600; }
  .small { font-size:0.92rem; color:var(--muted); margin-top:0.3rem; }
  @media (min-width:600px){
    input[type="text"]{ flex-basis:28%; }
  }
  .fade-enter { opacity:0; transform:translateY(10px); }
  .fade-enter-active { opacity:1; transform:translateY(0); transition:all 0.4s ease; }
</style>
</head>
<body>

<header>
  <h1>Forme interrogative — Test</h1>
  <p class="lead">Complète les deux premiers mots de chaque question. Valide chaque phrase pour voir la correction immédiatement.</p>
</header>

<main>
  <div id="quiz" class="quiz"></div>
  <div id="result"></div>
</main>

<script>
const allQuestions = [
  { clue: "My name's Paul.", template: "___ ___ name?", answer: ["What's","your"], correct: "What's your name?" },
  { clue: "I'm married.", template: "___ ___ married or single?", answer: ["Are","you"], correct: "Are you married or single?" },
  { clue: "No, they aren't.", template: "___ ___ American?", answer: ["Are","they"], correct: "Are they American?" },
  { clue: "Yes, I am.", template: "___ ___ Australian?", answer: ["Are","you"], correct: "Are you Australian?" },
  { clue: "No, she isn't.", template: "___ ___ a teacher?", answer: ["Is","she"], correct: "Is she a teacher?" },
  { clue: "She's from Italy.", template: "Where ___ your wife ___?", answer: ["is","from"], correct: "Where is your wife from?" },
  { clue: "She's Anna.", template: "___ ___ name?", answer: ["What's","her"], correct: "What's her name?" },
  { clue: "Yes, my mother is at home.", template: "___ your mother ___ home?", answer: ["Is","at"], correct: "Is your mother at home?" },
  { clue: "Yes, my parents are at school.", template: "___ your parents ___ school?", answer: ["Are","at"], correct: "Are your parents at school?" },
  { clue: "Yes, the shops are open today.", template: "___ the shops ___ today?", answer: ["Are","open"], correct: "Are the shops open today?" },
  { clue: "No, I'm not from London.", template: "___ ___ from London?", answer: ["Are","you"], correct: "Are you from London?" },
  { clue: "Yes, the post office is near here.", template: "___ the post office ___ here?", answer: ["Is","near"], correct: "Is the post office near here?" },
  { clue: "Yes, I am", template: "___ ___ sad?", answer: ["Are","you"], correct: "Are you sad?" },
  { clue: "I'm 25 years old.", template: "___ old ___ you?", answer: ["How","are"], correct: "How old are you?" },
  { clue: "Yes, I am happy.", template: "___ ___ happy?", answer: ["Are","you"], correct: "Are you happy?" },
  { clue: "No, he isn't tired.", template: "___ ___ tired?", answer: ["Is","he"], correct: "Is he tired?" },
  { clue: "Yes, she is a doctor.", template: "___ ___ a doctor?", answer: ["Is","she"], correct: "Is she a doctor?" },
  { clue: "No, we aren't late.", template: "___ ___ late?", answer: ["Are","we"], correct: "Are we late?" },
  { clue: "Yes, they are students.", template: "___ ___ students?", answer: ["Are","they"], correct: "Are they students?" },
  { clue: "No, it isn't cold.", template: "___ ___ cold?", answer: ["Is","it"], correct: "Is it cold?" },
  { clue: "Yes, you are my friend.", template: "___ ___ my friend?", answer: ["Are","you"], correct: "Are you my friend?" },
  { clue: "No, she isn't at home.", template: "___ ___ at home?", answer: ["Is","she"], correct: "Is she at home?" },
  { clue: "Yes, he is from Spain.", template: "___ ___ from Spain?", answer: ["Is","he"], correct: "Is he from Spain?" },
  { clue: "No, they aren't in the garden.", template: "___ ___ in the garden?", answer: ["Are","they"], correct: "Are they in the garden?" },
  { clue: "Yes, it is a sunny day.", template: "___ ___ a sunny day?", answer: ["Is","it"], correct: "Is it a sunny day?" },
  { clue: "No, we aren't busy.", template: "___ ___ busy?", answer: ["Are","we"], correct: "Are we busy?" },
  { clue: "Yes, she is ready.", template: "___ ___ ready?", answer: ["Is","she"], correct: "Is she ready?" }
];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let questions = shuffle(allQuestions);
let index = 0;
let score = 0;

const quiz = document.getElementById('quiz');
const resultDiv = document.getElementById('result');

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function normalize(s) {
  if (!s) return '';
  return s.toLowerCase()
          .replace(/[’'`]/g, "")
          .replace(/[“”"–—]/g,"")
          .replace(/[^a-z0-9\s]/g,"")
          .trim();
}
function isEqualInput(u,e){ return normalize(u) === normalize(e); }

function showQuestion(){
  if(index >= questions.length){
    quiz.innerHTML = `<div class="result-card"><h3>Quiz terminé 🎉</h3>
    <p class="small"><strong>Score final :</strong> ${score} / ${questions.length}</p></div>`;
    return;
  }
  const q = questions[index];
  const parts = q.template.split('___ ___');
  const before = parts[0];
  const after = parts.slice(1).join('___ ___');
  
  const card = document.createElement('div');
  card.className = 'card fade-enter';
  card.innerHTML = `
    <div class="clue"><strong>Indice :</strong> ${escapeHtml(q.clue)}</div>
    <div class="question-row">
      <span class="rest">${escapeHtml(before)}</span>
      <input type="text" id="ans1" placeholder="1er mot">
      <input type="text" id="ans2" placeholder="2e mot">
      <span class="rest">${escapeHtml(after)}</span>
    </div>
    <button id="validateBtn">Valider</button>
  `;
  
  quiz.innerHTML = '';
  quiz.appendChild(card);
  requestAnimationFrame(()=>card.classList.add('fade-enter-active'));
  
  document.getElementById('validateBtn').addEventListener('click', ()=> checkAnswer(q));
}

function checkAnswer(q){
  const u1 = document.getElementById('ans1').value.trim();
  const u2 = document.getElementById('ans2').value.trim();
  const ok1 = isEqualInput(u1, q.answer[0]);
  const ok2 = isEqualInput(u2, q.answer[1]);
  const ok = ok1 && ok2;
  if(ok) score++;

  const feedback = document.createElement('div');
  feedback.className = 'result-card fade-enter';
  feedback.innerHTML = `
    <div><strong>${ok ? "✅ Correct !" : "❌ Incorrect"}</strong></div>
    <div class="small">Ta réponse : 
      <span class="${ok1 ? 'ok' : 'bad'}">${escapeHtml(u1 || "(vide)")}</span> 
      <span class="${ok2 ? 'ok' : 'bad'}">${escapeHtml(u2 || "(vide)")}</span>
    </div>
    <div class="small">Réponse attendue : <strong>${escapeHtml(q.correct)}</strong></div>
  `;
  quiz.appendChild(feedback);
  requestAnimationFrame(()=>feedback.classList.add('fade-enter-active'));

  // changer le bouton
  const btn = document.getElementById('validateBtn');
  btn.textContent = "Suivant →";
  btn.onclick = ()=>{
    index++;
    showQuestion();
  };
}

showQuestion();
</script>

</body>
</html>
