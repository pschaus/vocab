<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quiz – Plaques en anglais</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --accent:#2b8a3e; --muted:#666; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
         background:var(--bg); color:#222; padding:1rem; }
  header { text-align:center; margin-bottom:1rem; }
  h1 { font-size:1.2rem; margin:0; }
  p.lead { margin:0.4rem 0 1.2rem 0; color:var(--muted); font-size:0.95rem; }
  .card { background:var(--card); border-radius:12px; padding:1.2rem; 
          box-shadow:0 6px 18px rgba(20,30,50,0.06); max-width:400px; margin:auto; text-align:center; }
  input[type="text"] { width:80%; padding:0.5rem; font-size:1.2rem; text-align:center; border-radius:10px; border:1px solid #ccc; margin-top:0.6rem; }
  button { padding:0.7rem 1rem; font-size:1rem; border:0; border-radius:10px; cursor:pointer; margin:0.3rem; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-secondary { background:#888; color:#fff; }
  .result { margin-top:0.8rem; font-weight:bold; font-size:1.1rem; }
  .ok { color:green; }
  .bad { color:#c33; }
</style>
</head>
<body>

<header>
  <h1>Quiz – Plaques d’immatriculation (écoute & écris)</h1>
  <p class="lead">Écoute la plaque prononcée en anglais, puis écris-la sans espaces.</p>
</header>

<main>
  <div class="card">
    <button id="playFast" class="btn-primary">🔊 Lecture rapide</button>
    <button id="playSlow" class="btn-secondary">🐢 Lecture lente</button>
    <div>
      <input type="text" id="answer" placeholder="ex: ab12cd">
    </div>
    <button id="checkBtn" class="btn-primary">✅ Valider</button>
    <button id="nextBtn" class="btn-secondary" style="display:none;">⏭ Suivant</button>
    <div id="feedback" class="result"></div>
  </div>
</main>

<script>
// Génère une plaque aléatoire (6 caractères : lettres et chiffres)
function randomPlate() {
  const letters = "abcdefghijklmnopqrstuvwxyz";
  const digits = "0123456789";
  let plate = "";
  for (let i = 0; i < 6; i++) {
    plate += Math.random() < 0.5 ? 
      letters[Math.floor(Math.random() * letters.length)] : 
      digits[Math.floor(Math.random() * digits.length)];
  }
  return plate;
}

let currentPlate = randomPlate();

function speakPlate(rate = 1) {
  const msg = new SpeechSynthesisUtterance();
  msg.lang = "en-GB"; // accent britannique, tu peux changer en "en-US"
  msg.rate = rate;
  msg.text = currentPlate.split("").join(" "); // épelle les lettres séparées
  window.speechSynthesis.speak(msg);
}

function newQuestion() {
  currentPlate = randomPlate();
  document.getElementById("answer").value = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
}

document.getElementById("playFast").onclick = () => speakPlate(1.1);
document.getElementById("playSlow").onclick = () => speakPlate(0.7);

document.getElementById("checkBtn").onclick = () => {
  const ans = document.getElementById("answer").value.trim().toLowerCase();
  const fb = document.getElementById("feedback");
  if (ans === currentPlate) {
    fb.textContent = "✅ Correct !";
    fb.className = "result ok";
  } else {
    fb.innerHTML = `❌ Mauvais. Réponse : <span class="bad">${currentPlate}</span>`;
    fb.className = "result bad";
  }
  document.getElementById("nextBtn").style.display = "inline-block";
};

document.getElementById("nextBtn").onclick = newQuestion;

// Démarre le premier quiz
speakPlate(1);
</script>

</body>
</html>
